<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>GeoJSONLayer using ArcGIS Maps SDK for JavaScript</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <arcgis-map basemap="gray-vector" center="-105.27,40" zoom="10">
      <arcgis-popup slot="popup"></arcgis-popup>
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-scale-bar slot="bottom-left"></arcgis-scale-bar>
    </arcgis-map>
    <script type="module">

  const GeoJSONLayer = await $arcgis.import(
    "@arcgis/core/layers/GeoJSONLayer.js"
  );

  const PictureMarkerSymbol = await $arcgis.import(
    "@arcgis/core/symbols/PictureMarkerSymbol.js"
  );

  const SimpleRenderer = await $arcgis.import(
    "@arcgis/core/renderers/SimpleRenderer.js"
  );

  const template = {
    title: "{name}",
    content: `
      <p><strong>Wildfire Information</strong></p>
      <p>
        <a href="{link}" target="_blank"
           rel="noopener noreferrer">
          Read news article
        </a>
      </p>
    `
  };

  // Fire icon
  const myIcon = {
    url: "data/fire.png",
    width: "24px",
    height: "24px"
  };

  // Create renderer
  const myRenderer = new SimpleRenderer({
    symbol: new PictureMarkerSymbol(myIcon)
  });

  // Create GeoJSON layer
  const layer = new GeoJSONLayer({
    url: "data/wildfire.json",
    copyright: "Denver Post and Daily Camera",
    popupTemplate: template,
    renderer: myRenderer
  });

  // Get map component
  const viewElement = document.querySelector("arcgis-map");

  await viewElement.viewOnReady();

  // Add wildfire layer
  viewElement.map.add(layer);

</script>
     </body>
</html>
